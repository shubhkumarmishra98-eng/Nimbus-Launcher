name: windows-exe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nimbus-launcher/**'
permissions:
  contents: write
defaults:
  run:
    working-directory: nimbus-launcher
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: nimbus-launcher/src-tauri
          cache-on-failure: true
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri icon src-tauri/icons/icon.png
      - name: Build portable exe
        run: cargo tauri build --no-bundle
        env:
          NIMBUS_MS_CLIENT_ID: ${{ secrets.NIMBUS_MS_CLIENT_ID }}
          NIMBUS_VERSION: 1.0.${{ github.run_number }}
          NIMBUS_UPDATE_REPO: ${{ github.repository }}
      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/nimbus-launcher.exe Nimbus-Launcher.exe
          (Get-FileHash Nimbus-Launcher.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline Nimbus-Launcher.exe.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nimbus Launcher 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            nimbus-launcher/Nimbus-Launcher.exe
            nimbus-launcher/Nimbus-Launcher.exe.sha256
