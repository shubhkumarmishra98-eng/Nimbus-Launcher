name: windows-exe
on:
  workflow_dispatch:
defaults:
  run:
    working-directory: nimbus-launcher
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: nimbus-launcher/src-tauri
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri icon src-tauri/icons/icon.png
      - name: Build portable exe (no installer)
        run: cargo tauri build --no-bundle
        env:
          NIMBUS_MS_CLIENT_ID: ${{ secrets.NIMBUS_MS_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: Nimbus-Launcher-portable
          path: nimbus-launcher/src-tauri/target/release/nimbus-launcher.exe
