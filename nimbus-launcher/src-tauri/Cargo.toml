[package]
name = "nimbus-launcher"
version = "1.0.0"
description = "Fast, lightweight Minecraft launcher"
edition = "2021"

[lib]
name = "nimbus_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "process", "fs", "io-util", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart", "http2"] }
futures-util = "0.3"
anyhow = "1"
sha1 = "0.10"
hex = "0.4"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sysinfo = "0.30"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
